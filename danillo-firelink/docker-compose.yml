version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: danillo-firelink_web_1
      APP_PORT: 8789
      # O painel fica atrás do login do Umbrel; a API (/api/v1) usa os tokens do firelink.
      PROXY_AUTH_WHITELIST: "/api/v1/*"

  # Daemon Docker só das stacks. Rede do host: as portas publicadas pelas stacks aparecem direto
  # no IP do Umbrel. Interfaces e iptables são os do Docker do Umbrel: um segundo dockerd recria as
  # chains DOCKER-* sem as redes do Umbrel (os apps ficam sem internet) e apaga o docker0 ao
  # reiniciar com --default-address-pool, a não ser com --live-restore. Por isso o daemon não mexe
  # no iptables, usa a bridge firelink0 e a chain FIRELINK libera e mascara só as faixas dele:
  # 10.120.0.0/16 (firelink0) e 10.121.0.0/16 (redes das stacks). Com --live-restore o dockerd sai
  # sem parar os containers, então o script os para antes, como o dockerd faria.
  docker:
    image: docker:29-dind
    privileged: true
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # docker0 com o endereço que o firelink usava até a 0.1.1: sobra dele, não do Umbrel
        if ip addr show docker0 2>/dev/null | grep -q 'inet 10.120.0.1/16'; then
          ip link set docker0 down; brctl delbr docker0
        fi
        brctl addbr firelink0 2>/dev/null || true
        ip addr add 10.120.0.1/16 dev firelink0 2>/dev/null || true
        ip link set firelink0 up
        for t in filter nat; do iptables -t $$t -N FIRELINK 2>/dev/null || iptables -t $$t -F FIRELINK; done
        iptables -A FIRELINK -s 10.120.0.0/15 -j ACCEPT
        iptables -A FIRELINK -d 10.120.0.0/15 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
        iptables -C FORWARD -j FIRELINK 2>/dev/null || iptables -I FORWARD -j FIRELINK
        iptables -t nat -A FIRELINK -s 10.120.0.0/15 ! -d 10.120.0.0/15 -j MASQUERADE
        iptables -t nat -C POSTROUTING -j FIRELINK 2>/dev/null || iptables -t nat -I POSTROUTING -j FIRELINK
        # Argumentos montados linha a linha, sem continuação com barra invertida: no Umbrel a
        # continuação se perdeu e o dockerd subiu só com a 1ª linha, mexendo no iptables do host.
        set -- --data-root=/data/docker --host=unix:///run/firelink/docker.sock --group=1000
        set -- "$$@" --pidfile=/run/firelink/dockerd.pid --iptables=false --ip6tables=false
        set -- "$$@" --bridge=firelink0 --default-address-pool=base=10.121.0.0/16,size=24
        set -- "$$@" --live-restore
        dockerd "$$@" &
        pid=$$!
        trap 'docker -H unix:///run/firelink/docker.sock ps -q | xargs -r docker -H unix:///run/firelink/docker.sock stop; kill $$pid' TERM INT
        wait $$pid || wait $$pid
    volumes:
      - ${APP_DATA_DIR}/data/docker:/data/docker
      # Mesmo caminho no web e aqui: o compose resolve caminhos relativos no web, quem monta é o daemon.
      - ${APP_DATA_DIR}/data/stacks:/firelink/stacks
      - ${APP_DATA_DIR}/run:/run/firelink

  web:
    image: ghcr.io/danillo-ao/firelink-server:0.2.1@sha256:fa5a7704a8044079147d1fc217ac3d86430ea524d733e523589c2deb6d2168d6
    user: "1000:1000"
    init: true
    restart: on-failure
    depends_on: [docker]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FIRELINK_DATA: /data
      FIRELINK_STACKS: /firelink/stacks
      DOCKER_HOST: unix:///run/firelink/docker.sock
      FIRELINK_PUBLIC_HOST: ${DEVICE_DOMAIN_NAME}
      FIRELINK_CHECK_HOST: host.docker.internal
      FIRELINK_PORT_RANGE: 20000-20999
    volumes:
      # data/.gitkeep, data/stacks/.gitkeep e run/.gitkeep fazem o Umbrel criar as pastas (dono
      # 1000) na instalação; sem elas o Docker as cria como root e o firelink não consegue gravar.
      - ${APP_DATA_DIR}/data/firelink:/data
      - ${APP_DATA_DIR}/data/stacks:/firelink/stacks
      - ${APP_DATA_DIR}/run:/run/firelink
