manifestVersion: 1
id: danillo-firelink
name: Firelink
tagline: Instala e acompanha suas aplicações self-hosted (Supabase, n8n…)
icon: https://raw.githubusercontent.com/danillo-ao/umbrel-store/main/danillo-firelink/icon.png
category: developer
version: "0.2.1"
port: 8789
description: >-
  Gerenciador de stacks Docker Compose no seu Umbrel: instala o Supabase, o n8n, o Uptime Kuma, um
  Postgres avulso ou qualquer docker-compose colado, gera as senhas e chaves, escolhe as portas e
  mantém tudo de pé. O painel mostra o status de cada serviço, CPU e memória, logs ao vivo, as
  credenciais e o histórico de operações.


  As stacks rodam num Docker próprio do firelink (Docker-in-Docker), separadas dos apps do Umbrel,
  e ficam acessíveis em umbrel.local nas portas 20000 a 20999. Desinstalar o firelink apaga todas
  as stacks e os dados delas.


  Para scripts e CI, crie um token no painel e use a API em http://umbrel.local:8789/api/v1.
developer: Danillo
website: https://github.com/danillo-ao/firelink
submitter: Danillo
submission: https://github.com/danillo-ao/umbrel-store
repo: https://github.com/danillo-ao/firelink
support: https://github.com/danillo-ao/firelink/issues
gallery: []
releaseNotes: >-
  Configuração mais clara: o compose aparece com o .env dele ao lado, e a nova aba CLI (antes Comandos) mostra os comandos com as variáveis deles ao lado. O .env e as variáveis agora usam o mesmo editor, em tabela ou texto, preservando os comentários do arquivo, e salvar o compose e o .env juntos aplica tudo numa operação só. Na criação por comandos, o formulário começa vazio, com exemplos prontos (Sentry e repositório com compose), e o caminho do compose acompanha o nome da stack.
