support: https://github.com/danillo-ao/firelink/issues
gallery: []
releaseNotes: >-
  Stremio Server: os apps do Stremio em outros aparelhos e o web.stremio.com conseguem usar o servidor. Eles rodam em HTTPS e o navegador bloqueava o endereço http://IP:porta; agora o modelo pede o IP do Umbrel na rede local, busca o certificado do Stremio e o servidor fica em https://<IP com hífens>.519b6502d940.stremio.rocks:<porta HTTPS>. Stacks já instaladas mantêm o compose antigo; para ter a correção, reinstale a partir do modelo.
