manifestVersion: 1
id: danillo-bonfire
name: Bonfire
tagline: Backups automatizados das pastas dos seus computadores
icon: https://raw.githubusercontent.com/danillo-ao/umbrel-store/main/danillo-bonfire/icon.png
category: files
# version e releaseNotes são reescritos pelo workflow release-server do repo bonfire
version: "0.2.1"
port: 8790
description: >-
  Guarda os backups (restic) enviados pelo app Bonfire Desktop e mostra todos eles num painel:
  máquinas pareadas, snapshots, download de arquivos, retenção e o local de armazenamento
  (disco interno ou HD externo).


  Para parear um computador, clique em "Adicionar máquina" no painel e cole o código no app
  desktop. Os backups chegam pela porta 8791.
developer: Danillo
website: https://github.com/danillo-ao/bonfire-releases
submitter: Danillo
submission: https://github.com/danillo-ao/umbrel-store
repo: https://github.com/danillo-ao/bonfire-releases
support: https://github.com/danillo-ao/bonfire-releases/issues
gallery: []
releaseNotes: >-
  O Umbrel serve o painel em http://umbrel.local, onde navigator.clipboard não existe: o botão dizia "Copiado" sem copiar nada. Agora copia selecionando o código. Painel: botões dos cartões alinhados, resumo por status, espaço usado/livre.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
